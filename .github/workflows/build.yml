name: Build Metamod Module
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install 32-bit compiler
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib git
      - name: Clone SDKs and Compile
        run: |
          HOST="github.com"
          git clone --depth 1 "https://${HOST}/rehlds/Metamod-R.git" metamod-r
          git clone --depth 1 "https://${HOST}/rehlds/ReHLDS.git" rehlds
          INCLUDES=$(find ./metamod-r ./rehlds -type d | sed 's/^/-I/')
          g++ -m32 -O2 -fPIC -shared -std=c++14 \
            -Dlinux -D__linux__ -DEXT_FUNC= \
            -include cstring -include cstdio \
            $INCLUDES \
            bot_steamid.cpp ./rehlds/rehlds/public/interface.cpp \
            -o fbstatus_mm_i386.so
      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: fbstatus_mm_i386
          path: fbstatus_mm_i386.so
